name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal \
            --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Format check
        run: make fmt-check

      - name: Test
        run: make test

      - name: Clippy
        run: make clippy

      - name: Docs
        run: make doc

      - name: Verify generated release assets
        run: |
          make man completions
          git diff --exit-code -- packaging

      - name: Verify clean package
        run: make package

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check minimum supported Rust
        run: cargo +1.85.0 check --locked --all-targets
