[package]
name = "cattail"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Tail multiple files and glob patterns with live discovery and labeled output"
readme = "README.md"
repository = "https://github.com/gracee3/cattail"
homepage = "https://github.com/gracee3/cattail"
documentation = "https://docs.rs/cattail"
keywords = ["tail", "log", "cli", "filesystem", "glob"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "Makefile",
    "docs/**",
    "packaging/**",
    "scripts/**",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
notify = "8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
